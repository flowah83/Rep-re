name: Deploy coach worker

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Secrets Cloudflare
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Déploiement du coach ignoré" >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID est absent. Le worker n’a pas été publié. Le déploiement depuis la machine de Florian reste le chemin prévu." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Coach non déployé::Secrets Cloudflare absents. Le job de déploiement est ignoré."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "### Secrets Cloudflare présents" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-fund --no-audit wrangler@4.42.1
          npx wrangler deploy
