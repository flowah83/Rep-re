<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Repère — Séance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="screen theme-dark">
  <header class="status">
    <span class="time num">18:26</span>
    <span class="island"></span>
    <span class="sigs">
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><rect x="0" y="7.5" width="3" height="4.5" rx="0.6" fill="currentColor"/><rect x="4.6" y="5" width="3" height="7" rx="0.6" fill="currentColor"/><rect x="9.2" y="2.4" width="3" height="9.6" rx="0.6" fill="currentColor"/><rect x="13.8" y="0" width="3" height="12" rx="0.6" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true"><path d="M1.2 4.3c3.4-2.8 10.2-2.8 13.6 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M3.5 6.7c2.3-1.8 6.7-1.8 9 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6 9c1.1-.8 2.9-.8 4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11" r="0.9" fill="currentColor"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true"><rect x="0.7" y="0.7" width="20.6" height="10.6" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2.3" y="2.3" width="16.2" height="7.4" rx="1.2" fill="currentColor"/><rect x="22.4" y="3.8" width="1.6" height="4.4" rx="0.7" fill="currentColor" opacity="0.45"/></svg>
    </span>
  </header>
  <main class="full">
    <div class="sesshead">
      <div>
        <div class="eyebrow num">22:18 écoulées · série 2 sur 4</div>
        <h1>Poussée</h1>
      </div>
      <button class="linkend">Terminer</button>
    </div>

    <section class="exblock">
      <div class="row">
        <h2>Développé couché</h2>
        <button class="pill">Le geste</button>
      </div>
      <p class="last num">La dernière fois · 80 kg × 6, 6, 6, 5</p>
    </section>

    <div class="sets">
      <div class="sethead"><span>Série</span><span>kg</span><span>Reps</span><span>RPE</span><span></span></div>
      <div class="set warm done"><span class="idx">éch.</span><span class="val num">60</span><span class="val num">8</span><span class="val num">—</span><span class="tick"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.2 6.2 4.7 8.7 9.8 3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="set done"><span class="idx num">1</span><span class="val num">80</span><span class="val num">6</span><span class="val num">7</span><span class="tick"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.2 6.2 4.7 8.7 9.8 3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="set done"><span class="idx num">2</span><span class="val num">80</span><span class="val num">6</span><span class="val num">8</span><span class="tick"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.2 6.2 4.7 8.7 9.8 3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="set next"><span class="idx num">3</span><span class="val target num">80</span><span class="val num">—</span><span class="val num">—</span><span class="tick"></span></div>
      <div class="set"><span class="idx num">4</span><span class="val num" style="color:var(--ink-soft)">80</span><span class="val num">—</span><span class="val num">—</span><span class="tick"></span></div>
    </div>

    <div class="grow"></div>

    <section class="rest">
      <div class="label">Repos</div>
      <div class="big num">1:24</div>
      <div class="bar" aria-hidden="true"><i></i></div>
      <p class="sub">Puis série 3 · développé couché · 80&nbsp;kg</p>
      <div class="restacts">
        <button>−30&nbsp;s</button>
        <button>+30&nbsp;s</button>
        <button class="pass">Passer</button>
      </div>
    </section>
  </main>
  <div class="home"></div>
</body>
</html>
