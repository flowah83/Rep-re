<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Repère — vue d’ensemble</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="board">
  <header class="board-head">
    <div class="brand">
      <div class="markr">R</div>
      <div>
        <h1>Repère</h1>
        <p>Maquettes iPhone · usage personnel · données fictives</p>
      </div>
    </div>
    <div class="board-meta">
      Clair et sombre, comme sur l’iPhone<br />
      Écran 393 × 852 · octobre 2026
    </div>
  </header>
  <div class="grid">
    <figure class="shot">
      <div class="device"><img src="../01_aujourdhui.png" alt="Écran Aujourd’hui" /></div>
      <figcaption><b>01 · Aujourd’hui</b><span>La séance prévue par Chef sport</span></figcaption>
    </figure>
    <figure class="shot">
      <div class="device"><img src="../02_seance.png" alt="Écran séance en cours" /></div>
      <figcaption><b>02 · Séance</b><span>Séries notées, repos en cours</span></figcaption>
    </figure>
    <figure class="shot">
      <div class="device"><img src="../03_exercice.png" alt="Fiche exercice" /></div>
      <figcaption><b>03 · Le geste</b><span>Mannequin en boucle, muscles en cuivre</span></figcaption>
    </figure>
    <figure class="shot">
      <div class="device"><img src="../04_progression.png" alt="Écran progrès" /></div>
      <figcaption><b>04 · Progrès</b><span>Estimation, séries dures, records</span></figcaption>
    </figure>
    <figure class="shot">
      <div class="device"><img src="../05_historique.png" alt="Carnet" /></div>
      <figcaption><b>05 · Carnet</b><span>Les séances passées, semaine par semaine</span></figcaption>
    </figure>
    <figure class="shot">
      <div class="device"><img src="../06_bilan.png" alt="Bilan de séance" /></div>
      <figcaption><b>06 · Bilan</b><span>Le compte-rendu, avant envoi</span></figcaption>
    </figure>
  </div>
  <p class="board-foot">Les poids, les dates de séances et les records sont inventés pour la maquette. Rien n’est envoyé.</p>
</body>
</html>
